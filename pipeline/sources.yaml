# Parcel Pigeon sources. Add or remove lines freely; the pipeline skips any feed that fails.
# "direct" feeds give full article text and produce the best stories.
# "discovery" feeds are Google News searches: they catch everything else, but some links
# can't be read automatically, so those headlines land in data/review.json for you to check.

direct:
  - {name: TransImpact, url: "https://transimpact.com/blog/rss.xml", house: true}   # our own posts: shown in the TransImpact feed
  - {name: Supply Chain Dive, url: "https://www.supplychaindive.com/feeds/news/"}
  - {name: Trucking Dive,     url: "https://www.truckingdive.com/feeds/news/"}
  - {name: Retail Dive,       url: "https://www.retaildive.com/feeds/news/"}
  - {name: FreightWaves,      url: "https://www.freightwaves.com/news/feed"}
  - {name: FreightWaves Parcel, url: "https://www.freightwaves.com/news/category/news/trucking/parcel/feed"}
  - {name: Modern Retail,     url: "https://www.modernretail.co/feed/"}
  - {name: DroneXL,           url: "https://dronexl.co/feed/"}
  - {name: DC Velocity,       url: "https://www.dcvelocity.com/feeds/feed.rss"}
  - {name: Post & Parcel,     url: "https://postandparcel.info/feed/"}   # global postal news; triage keeps only what matters to U.S. shippers

discovery:
