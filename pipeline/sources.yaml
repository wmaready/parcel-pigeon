  - "site:reuters.com UPS OR FedEx OR \"Postal Service\" OR parcel OR \"Amazon delivery\" OR OnTrac"
  - "site:wsj.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:bloomberg.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:cnbc.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:apnews.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:businessinsider.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:axios.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:ft.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:nytimes.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:forbes.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:fortune.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:techcrunch.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  # More parcel, logistics and e-commerce trade press
  - "site:ttnews.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:joc.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:digitalcommerce360.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:aircargonews.net UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:ccjdigital.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:retailbrew.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:pymnts.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:supplychain247.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:inboundlogistics.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:postandparcel.info UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  - "site:retaildive.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"Amazon Shipping\" OR OnTrac OR \"last mile\""
  # Trade outlets worth checking every run
  - "site:parcelindustry.com"
  - "site:parcelindustry.com carrier OR parcel OR shipping OR UPS OR FedEx"
  - "site:parcelindustry.com column OR opinion OR negotiation OR audit"
  - "site:logisticsmgmt.com parcel OR express OR \"small package\""
  - "site:freightwaves.com parcel OR UPS OR FedEx OR USPS OR Amazon"
  - "site:supplychaindive.com parcel OR UPS OR FedEx OR USPS OR Amazon"
  - "site:dcvelocity.com parcel"
  - "site:logisticsmgmt.com parcel"
  - "site:modernretail.co shipping OR delivery"
  # Carriers and regulators
  - "site:prc.gov"
  - "OnTrac"
  - "\"Amazon Shipping\""
  - "\"DHL eCommerce\" OR \"DHL Express\" rates"
  # Regional and alternative carriers, one search each
  - "\"Spee-Dee\" delivery"
  - "\"GLS US\" OR \"GLS Group\" parcel"
  - "UniUni"
  - "\"LSO\" \"Lone Star Overnight\" OR LSO parcel"
  - "Veho delivery"
  - "\"Better Trucks\""
  - "GOFO parcel OR \"GOFO Express\""
  - "Jitsu delivery"
  - "\"CDL Last Mile\" OR \"CDL\" courier"
  - "\"DHL eCommerce\""
  - "SpeedX OR \"Dragonfly Shipping\" OR \"United Delivery Service\""
  - "\"Pitney Bowes\" parcel OR shipping"
  # Mergers, acquisitions, funding
  - "parcel carrier acquisition OR acquires OR merger"
  - "courier acquires OR acquisition last mile"
  - "last-mile delivery funding OR raises OR SPAC OR IPO"
  - "shipping software acquisition OR acquires"
  # Topics
  - "UPS surcharge OR \"rate increase\""
  - "FedEx surcharge OR \"rate increase\""
  - "USPS price change OR \"Ground Advantage\""
  - "\"demand surcharge\" OR \"peak surcharge\""
  - "\"fuel surcharge\" parcel"
  - "Teamsters UPS"
  - "\"de minimis\" shipping"
  - "parcel carrier news"
  # Opinion, commentary and analysis
  - "site:freightwaves.com commentary parcel OR UPS OR FedEx OR USPS"
  - "site:supplychaindive.com opinion OR analysis parcel OR delivery"
  - "parcel industry analyst OR opinion UPS FedEx Amazon"
  - "last mile delivery industry news"
  # Carrier technology
  - 'UPS API OR "UPS developer" OR "UPS.com" new tool'
  - 'FedEx API OR "FedEx developer" OR "FedEx Ship Manager"'
  - 'USPS API OR "USPS Web Tools" OR "USPS Ship"'
  - "carrier RFID OR robotics OR AI parcel"
  - "shipping software carrier integration"
  # Carrier strategy
  - 'UPS strategy OR "Carol Tome" OR "investor day"'
  - 'FedEx strategy OR "Network 2.0" OR "Raj Subramaniam"'
  - '"Postmaster General" OR "USPS plan"'

  # Same-day, gig platforms and retailer delivery partnerships
  - "DoorDash retail delivery OR returns OR partnership"
  - "\"Uber Eats\" OR \"Uber Direct\" retail delivery OR returns OR partnership"
  - "Instacart OR Shipt OR Gopuff retailer partnership same-day delivery"
  - "same-day delivery expansion Walmart OR Target OR \"Home Depot\" OR Lowe's OR \"Best Buy\" OR Costco OR Kroger OR \"Dollar General\""
  - "Roadie OR Veho OR OnTrac OR \"Better Trucks\" partnership retailer"
  - "\"Happy Returns\" OR \"FedEx Easy Returns\" OR \"no-box returns\" partnership"
  - "USPS last-mile agreement OR contract parcel"
  # 3PLs and special services
  - "3PL acquisition OR raises e-commerce fulfillment"
  - "cold chain parcel OR \"UPS Healthcare\" OR \"FedEx Life Sciences\" OR GLP-1 shipping"
  - "AI agent shipping OR \"parcel audit\" OR \"rate shopping\" launch"
  - "drone delivery Zipline OR Wing OR \"Prime Air\" OR \"Part 108\""
  - "delivery robot Serve Robotics OR Starship OR Coco"
  # UPS EZ Rates and other new pricing programs (no public UPS document as of Oct 2026)
  - "UPS \"EZ Rates\" OR \"EZ pricing\""
  - "site:ups.com rate guide OR \"rate changes\" 2027"
  # Market reports and indexes (news when released; also saved to the library)
  - "Pitney Bowes Parcel Shipping Index OR BOXpoll"
  - "ShipMatrix parcel volume OR on-time OR peak capacity"
  - "parcel market report OR index OR survey 2026 shipping"
  - "holiday e-commerce forecast Adobe OR Deloitte OR NRF OR Salesforce"
  - "returns report NRF OR Narvar OR \"Happy Returns\""
  - "\"Logistics Managers' Index\" OR \"Cass Freight Index\""
  - "USPS Inspector General report packages OR parcels"
  # Legal
  - "lawsuit UPS OR FedEx OR Amazon delivery drivers OR surcharge OR class action"
  - "NLRB Amazon DSP OR Teamsters UPS grievance"
  - "patent lawsuit delivery OR parcel OR logistics technology"
  - "antitrust Amazon logistics OR fulfillment"
  - "UPS news parcel"
  - "FedEx news parcel OR shipping"
  - "USPS packages OR \"Ground Advantage\" OR \"Priority Mail\" news"
  - "\"Amazon Logistics\" OR \"Amazon Shipping\" OR \"Amazon delivery\""
  - "\"Ground Saver\" OR \"SurePost\" OR \"Ground Economy\""
  - "regional parcel carrier expansion OR launches OR new service"
  - "UPS OR FedEx building OR hub OR facility closing OR opening"
  - "e-commerce shipping costs shippers 2026"
  - "parcel volume 2026 OR \"parcel volumes\""
  - "\"FedEx Freight\" OR \"UPS Supply Chain\" parcel"
  - "\"Canada Post\" OR Purolator parcel U.S."
  - "\"Postal Regulatory Commission\" OR PRC price OR rates"
  - "site:parcelandpostaltechnologyinternational.com"
  - "site:theloadstar.com parcel OR express"
  - "site:supplychainbrain.com parcel OR last mile"
  - "site:retailtouchpoints.com shipping OR delivery OR returns"

# Company and regulator sources, read every hour so a filing or release is screened before the press writes it up.
# kind: edgar = a company's SEC filings (data.sec.gov submissions data; 8-K current reports only); fedreg = a Federal Register feed; gnews = a Google News
# search of a press-release wire or newsroom. Items from these are tier 0 (the company's own word).
primary:
  - {name: "SEC: UPS 8-K",           kind: edgar, company: UPS,           url: "https://data.sec.gov/submissions/CIK0001090727.json"}
  - {name: "SEC: FedEx 8-K",         kind: edgar, company: FedEx,         url: "https://data.sec.gov/submissions/CIK0001048911.json"}
  - {name: "SEC: Amazon 8-K",        kind: edgar, company: Amazon,        url: "https://data.sec.gov/submissions/CIK0001018724.json"}
  - {name: "SEC: Pitney Bowes 8-K",  kind: edgar, company: Pitney Bowes,  url: "https://data.sec.gov/submissions/CIK0000078814.json"}
  - {name: "Federal Register: USPS", kind: fedreg, url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=postal-service&order=newest"}
  - {name: "Federal Register: PRC",  kind: fedreg, url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=postal-regulatory-commission&order=newest"}
  - {name: "Federal Register: de minimis and postal imports", kind: fedreg, url: "https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=%22de+minimis%22+OR+%22postal+shipments%22&order=newest"}
  - {name: "Wire: PR Newswire",      kind: gnews, q: "site:prnewswire.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"last mile\" OR \"Amazon Shipping\" OR OnTrac OR courier"}
  - {name: "Wire: Business Wire",    kind: gnews, q: "site:businesswire.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"last mile\" OR \"Amazon Shipping\" OR OnTrac OR courier"}
  - {name: "Wire: GlobeNewswire",    kind: gnews, q: "site:globenewswire.com UPS OR FedEx OR USPS OR \"Postal Service\" OR parcel OR \"last mile\" OR \"Amazon Shipping\" OR OnTrac OR courier"}
  - {name: "Newsroom: UPS",          kind: gnews, q: "site:about.ups.com"}
  - {name: "Newsroom: FedEx",        kind: gnews, q: "site:newsroom.fedex.com"}
  - {name: "Newsroom: USPS",         kind: gnews, q: "site:about.usps.com"}
  - {name: "Newsroom: Amazon",       kind: gnews, q: "site:aboutamazon.com delivery OR shipping OR logistics"}

# Carrier pages and files watched every hour. Any change is compared word-for-word with the last copy;
# if it matters to shippers, an agent drafts a Parcel Pigeon story and opens a GitHub issue for you to approve.
# kind: page = web page (also catches newly posted PDF links), pdf = a rate guide or notice file.
# mode: full = keep the whole page's text (lists of news releases), not just the main article block.
watch:
  # UPS
  - {carrier: UPS,    kind: page, name: Rate and Service Guides,   url: "https://www.ups.com/us/en/support/shipping-support/shipping-costs-rates"}
  - {carrier: UPS,    kind: page, name: Rate updates and notices,  url: "https://ups.com/rateupdates"}
  - {carrier: UPS,    kind: page, name: Fuel surcharges,           url: "https://www.ups.com/us/en/support/shipping-support/shipping-costs-rates/fuel-surcharges"}
  - {carrier: UPS,    kind: page, name: Service alerts,            url: "https://www.ups.com/us/en/service-alerts"}
  - {carrier: UPS,    kind: page, name: Daily Rate and Service Guide page, url: "https://www.ups.com/us/en/support/shipping-support/shipping-costs-rates/daily-rates.page"}
  - {carrier: UPS,    kind: pdf,  name: Daily Rate and Service Guide, url: "https://assets.ups.com/adobe/assets/urn:aaid:aem:356d938a-4f0a-4c71-b50e-bdd890f50b47/original/as/daily-rates-us-en.pdf"}
  - {carrier: UPS,    kind: pdf,  name: Small Business Rates guide, url: "https://assets.ups.com/adobe/assets/urn:aaid:aem:bbf2553c-15e5-4b2d-abcd-b7445b13daa0/original/as/small-business-rate-guide-us-en.pdf"}
  - {carrier: UPS,    kind: page, name: Developer portal,          url: "https://developer.ups.com/"}
  # FedEx
  - {carrier: FedEx,  kind: page, name: Service Guide,             url: "https://www.fedex.com/en-us/service-guide.html"}
  - {carrier: FedEx,  kind: page, name: Surcharges and fees,       url: "https://www.fedex.com/en-us/shipping/rate-changes/additional-shipping-fees.html"}
  - {carrier: FedEx,  kind: page, name: Demand surcharges,         url: "https://www.fedex.com/en-us/shipping/rate-changes/demand-surcharges.html"}
  - {carrier: FedEx,  kind: page, name: Fuel surcharge,            url: "https://www.fedex.com/en-us/shipping/fuel-surcharge.html"}
  - {carrier: FedEx,  kind: page, name: Service alerts,            url: "https://www.fedex.com/en-us/service-alerts.html"}
  - {carrier: FedEx,  kind: page, name: Rate changes hub,          url: "https://www.fedex.com/en-us/shipping/rate-changes.html"}
  - {carrier: FedEx,  kind: pdf,  name: 2027 Surcharge and fee changes, url: "https://www.fedex.com/content/dam/fedex/us-united-states/services/surcharge_and_fee_changes_2027.pdf"}
  - {carrier: FedEx,  kind: pdf,  name: 2027 Standard List Rates,  url: "https://www.fedex.com/content/dam/fedex/us-united-states/services/FedEx_Standard_List_Rates_2027.pdf"}
  - {carrier: FedEx,  kind: pdf,  name: 2027 Delivery Area Surcharge ZIPs, url: "https://www.fedex.com/content/dam/fedex/us-united-states/services/DAS_Contiguous_Extended_Remote_Alaska_Hawaii_2027.pdf"}
  - {carrier: FedEx,  kind: pdf,  name: 2027 Pickup Area Surcharge ZIPs, url: "https://www.fedex.com/content/dam/fedex/us-united-states/services/PAS_Contiguous_Extended_Remote_2027.pdf"}
  - {carrier: FedEx,  kind: pdf,  name: 2026 Standard List Rates,  url: "https://www.fedex.com/content/dam/fedex/us-united-states/services/FedEx_Standard_List_Rates_2026.pdf"}
  - {carrier: FedEx,  kind: page, name: Developer portal,          url: "https://developer.fedex.com/"}
  # USPS
  - {carrier: USPS,   kind: page, name: Price change center,       url: "https://pe.usps.com/PriceChange/Index"}
  - {carrier: USPS,   kind: page, name: Newsroom releases,         url: "https://about.usps.com/newsroom/national-releases/", mode: full}
  # OnTrac
  - {carrier: OnTrac, kind: page, name: Surcharges and rates,      url: "https://www.ontrac.com/surchargesandrates/"}
  - {carrier: OnTrac, kind: page, name: Service alerts,            url: "https://www.ontrac.com/service-alerts/"}
  - {carrier: OnTrac, kind: pdf,  name: 2026 list rates,           url: "https://ontrac.sirv.com/pdf/2026-OnTrac-Rates.pdf"}
  - {carrier: OnTrac, kind: pdf,  name: Delivery area ZIP list,    url: "https://ontrac.sirv.com/pdf/ontrac-area-surcharge-zip-codes.pdf"}
  # Regional carriers
  - {carrier: Spee-Dee, kind: page, name: Service updates,      url: "https://speedeedelivery.com/service-updates/"}
  - {carrier: UniUni, kind: page, name: Newsroom,               url: "https://www.uniuni.com/news/", mode: full}
  # Amazon
  - {carrier: Amazon, kind: page, name: Peak surcharge notice,     url: "https://shipping.amazon.com/insights-and-news/peak-surcharge-2026"}
