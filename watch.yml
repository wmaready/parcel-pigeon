name: Watch carrier pages
on:
  schedule:
    - cron: "5 * * * *"        # every hour
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency: {group: parcel-pigeon, cancel-in-progress: false}
jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Make sure approval labels exist
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh label create draft   --color FFD400 --description "Story drafted by Parcel Pigeon" --force
          gh label create publish --color 1D7044 --description "Add this to publish the draft" --force
          gh label create audit --color 5319E7 --description "Auditor found something to check" --force
          gh label create guide-change --color 0E8A16 --description "Language or trigger change in a carrier guide" --force
          gh label create first-to-report --color B60205 --description "Nobody else has reported this yet" --force
      - name: Publish approved drafts, then check carrier pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: pipeline
        run: |
          python publish.py || echo "::warning::publish.py failed"
          python watch.py || echo "::warning::watch.py failed"
          python docwatch.py --batch 15 || true
          node export_seed.js ../index.html ../data/seed.json || true
          python audit.py --offline || true
      - name: Save
        run: |
          git config user.name "parcel-pigeon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Watch $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
      - name: Leave raw page copies out of the public site
        run: rm -rf data/snapshots data/docwatch
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: "."}
      - id: deploy
        uses: actions/deploy-pages@v4
