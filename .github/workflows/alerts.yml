{
 "name": "Alerts: approve and send",
 "on": {
  "issue_comment": {
   "types": [
    "created"
   ]
  },
  "schedule": [
   {
    "cron": "*/15 * * * *"
   }
  ],
  "workflow_dispatch": {
   "inputs": {
    "test": {
     "description": "Send me a test major alert to approve (goes to my phone only)",
     "type": "boolean",
     "default": false
    }
   }
  }
 },
 "permissions": {
  "contents": "read",
  "issues": "write"
 },
 "concurrency": {
  "group": "alerts",
  "cancel-in-progress": false
 },
 "jobs": {
  "review": {
   "runs-on": "ubuntu-latest",
   "if": "github.event_name != 'issue_comment' || (contains(github.event.issue.labels.*.name, 'alert-review') && github.event.comment.author_association == 'OWNER')",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt"
    },
    {
     "name": "Make sure labels exist",
     "env": {
      "GH_TOKEN": "${{ github.token }}"
     },
     "run": "gh label create alert-review --color D93F0B --description \"Major alert waiting for your OK: reply send or hold\" --force\ngh label create alert-sent --color 0E8A16 --force\ngh label create alert-held --color BFD4F2 --force\n"
    },
    {
     "name": "Open a test alert",
     "if": "github.event_name == 'workflow_dispatch' && inputs.test",
     "working-directory": "pipeline",
     "env": {
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}"
     },
     "run": "python alerts.py --test"
    },
    {
     "name": "Send approved or overdue major alerts",
     "working-directory": "pipeline",
     "env": {
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}"
     },
     "run": "python alerts.py --review"
    }
   ]
  }
 }
}
