{
 "name": "Update Parcel Pigeon",
 "permissions": {
  "contents": "write",
  "issues": "write",
  "pages": "write",
  "id-token": "write"
 },
 "concurrency": {
  "group": "${{ github.event_name == 'push' && 'parcel-pigeon-deploy' || 'parcel-pigeon' }}",
  "cancel-in-progress": false
 },
 "jobs": {
  "update": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 45,
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt"
    },
    {
     "name": "Make sure labels exist",
     "env": {
      "GH_TOKEN": "${{ github.token }}"
     },
     "run": "gh label create draft --color FFD400 --force\ngh label create publish --color 1D7044 --force\ngh label create audit --color 5319E7 --description \"Auditor found something to check\" --force\ngh label create first-to-report --color B60205 --force\ngh label create alert-review --color D93F0B --description \"Major alert waiting for your OK: reply send or hold\" --force\ngh label create alert-sent --color 0E8A16 --force\ngh label create alert-held --color BFD4F2 --force\n"
    },
    {
     "name": "Run pipeline",
     "if": "github.event_name != 'push'",
     "env": {
      "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
      "PP_MONTHLY_BUDGET": "${{ vars.PP_MONTHLY_BUDGET || '75' }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}",
      "EIA_API_KEY": "${{ secrets.EIA_API_KEY }}",
      "OILPRICE_API_KEY": "${{ secrets.OILPRICE_API_KEY }}",
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "PP_FETCH_PROXY": "${{ secrets.PP_FETCH_PROXY }}",
      "SEC_CONTACT": "${{ secrets.SEC_CONTACT }}"
     },
     "working-directory": "pipeline",
     "run": "python fuel.py || true\npython markets.py || true\n# earnings history: new quarters from the release (unchecked until a person checks them) and the stock move after each report\npython earnings.py || echo \"::warning::earnings.py failed; the earnings history keeps its last good figures (details above)\"\n# nightly company research slot: up to 3 candidates (at most $0.50), first thing on the 04 UTC run, before the news,\n# so the day's pacing can never starve it (it skips the day's pacing, never the month's limit)\nif python due.py slot 4; then python players.py --slot && python due.py --done slot || true; fi\npython news.py || echo \"::warning::news.py failed; saving the other updates anyway\"\n# memory across years: new price events join the almanac; year-over-year notes refresh weekly\npython themes.py || true\n# the 60-second brief is written once a day, on the first run from 8 a.m. Eastern (or when run by hand)\nif python due.py brief 8 --et || [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then python brief.py && python due.py --done brief --et || true; fi\npython publish.py || true\nnode export_seed.js ../index.html ../data/seed.json || true\n# new market movers: the ranking lists are read about once a month (the script skips them until 30 days pass)\n# new candidates are researched once a day on the first run after 04 UTC, or right now if you started this run by hand\nif python due.py players 4 || [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then python players.py --max 6 && python due.py --done players || true; fi\n# phone alerts: regular ones go out now, major ones wait for your OK\npython alerts.py || echo \"::warning::alerts.py failed\"\n# full audit (link checks and Claude fact checks) once a day on the first run after 04 UTC; quick offline checks otherwise\nif python due.py audit 4; then python audit.py && python due.py --done audit || true; else python audit.py --offline || true; fi\n# the rate clock as a calendar feed (data/rates.ics) for Outlook, Teams and Google Calendar subscribers\npython ratecal.py || echo \"::warning::ratecal.py failed\"\n"
    },
    {
     "name": "Save new data",
     "if": "github.event_name != 'push'",
     "run": "git config user.name \"parcel-pigeon-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add data\ngit diff --cached --quiet || (git commit -m \"Update data $(date -u +%Y-%m-%dT%H:%MZ)\" && git pull --rebase && git push)\n"
    },
    {
     "name": "Leave raw page copies out of the public site",
     "run": "rm -rf data/snapshots data/docwatch data/usage.json data/usage_sweep.json data/due.json"
    },
    {
     "uses": "actions/configure-pages@v5"
    },
    {
     "uses": "actions/upload-pages-artifact@v3",
     "with": {
      "path": "."
     }
    },
    {
     "id": "deploy",
     "uses": "actions/deploy-pages@v4"
    }
   ],
   "environment": {
    "name": "github-pages",
    "url": "${{ steps.deploy.outputs.page_url }}"
   }
  }
 },
 "on": {
  "schedule": [
   {
    "cron": "17 10-23/2 * * *"
   },
   {
    "cron": "17 4 * * *"
   }
  ],
  "workflow_dispatch": {},
  "push": {
   "branches": [
    "main"
   ]
  }
 }
}
