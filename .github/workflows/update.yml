{
 "name": "Update Parcel Pigeon",
 "permissions": {
  "contents": "write",
  "issues": "write",
  "pages": "write",
  "id-token": "write"
 },
 "concurrency": {
  "group": "${{ github.event_name == 'push' && 'parcel-pigeon-deploy' || 'parcel-pigeon' }}",
  "cancel-in-progress": false
 },
 "jobs": {
  "update": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 45,
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt"
    },
    {
     "name": "Make sure labels exist",
     "env": {
      "GH_TOKEN": "${{ github.token }}"
     },
     "run": "gh label create draft --color FFD400 --force\ngh label create publish --color 1D7044 --force\ngh label create audit --color 5319E7 --description \"Auditor found something to check\" --force\ngh label create first-to-report --color B60205 --force\ngh label create alert-review --color D93F0B --description \"Major alert waiting for your OK: reply send or hold\" --force\ngh label create alert-sent --color 0E8A16 --force\ngh label create alert-held --color BFD4F2 --force\n"
    },
    {
     "name": "Run pipeline",
     "if": "github.event_name != 'push'",
     "env": {
      "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
      "PP_MONTHLY_BUDGET": "${{ vars.PP_MONTHLY_BUDGET || '85' }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}",
      "EIA_API_KEY": "${{ secrets.EIA_API_KEY }}",
      "OILPRICE_API_KEY": "${{ secrets.OILPRICE_API_KEY }}",
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "PP_FETCH_PROXY": "${{ secrets.PP_FETCH_PROXY }}",
      "SEC_CONTACT": "${{ secrets.SEC_CONTACT }}"
     },
     "working-directory": "pipeline",
     "run": "# B11: every robot step runs; a failure is recorded as an ::error annotation, the run carries on (data is saved and the\n# site deployed), and the last step of the job turns the run red. Nothing is hidden behind '|| true' any more.\nset +e\nFAILED=\"\"\nstep() { name=\"$1\"; shift; \"$@\" && return 0; echo \"::error title=$name failed::$name exited with an error; the run carried on without it\"; FAILED=\"$FAILED $name;\"; return 1; }\n# optional keys: a missing one is a yellow warning, not a red run\n[ -n \"$OILPRICE_API_KEY\" ] || echo \"::warning title=OILPRICE_API_KEY not set::UPS and FedEx weekly fuel will not update from OilPriceAPI\"\n[ -n \"$EIA_API_KEY\" ] || echo \"::warning title=EIA_API_KEY not set::the weekly diesel price will not update\"\nstep fuel.py python fuel.py\nstep markets.py python markets.py\n# earnings history: new quarters from the release (unchecked until a person checks them) and the stock move after each report\nstep earnings.py python earnings.py\n# nightly company research slot: up to 3 candidates (at most $0.50), first thing on the 04 UTC run, before the news,\n# so the day's pacing can never starve it (it skips the day's pacing, never the month's limit)\nif python due.py slot 4; then python players.py --slot && python due.py --done slot || true; fi\nstep news.py python news.py\n# memory across years: new price events join the almanac; year-over-year notes refresh weekly\nstep themes.py python themes.py\n# the 60-second brief is written once a day, on the first run from 8 a.m. Eastern (or when run by hand)\nif python due.py brief 8 --et || [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then python brief.py && python due.py --done brief --et || true; fi\nstep publish.py python publish.py\nstep \"seed export\" node export_seed.js ../index.html ../data/seed.json\n# new market movers: the ranking lists are read about once a month (the script skips them until 30 days pass)\n# new candidates are researched once a day on the first run after 04 UTC, or right now if you started this run by hand\nif python due.py players 4 || [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then python players.py --max 6 && python due.py --done players || true; fi\n# phone alerts: regular ones go out now, major ones wait for your OK\nstep alerts.py python alerts.py\n# full audit (link checks and Claude fact checks) once a day on the first run after 04 UTC; quick offline checks otherwise\nif python due.py audit 4; then step audit.py python audit.py && python due.py --done audit; else step \"audit.py --offline\" python audit.py --offline; fi\n# the rate clock as a calendar feed (data/rates.ics) for Outlook, Teams and Google Calendar subscribers\n# same-week ties: an earnings report and the rate or guide changes around it (data/events.json)\nstep events.py python events.py\nstep ratecal.py python ratecal.py\necho \"PP_FAILED=$FAILED\" >> \"$GITHUB_ENV\"\n"
    },
    {
     "name": "Save new data",
     "if": "github.event_name != 'push'",
     "run": "git config user.name \"parcel-pigeon-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add data\ngit diff --cached --quiet || (git commit -m \"Update data $(date -u +%Y-%m-%dT%H:%MZ)\" && git pull --rebase && git push)\n"
    },
    {
     "name": "Leave raw page copies out of the public site",
     "run": "rm -rf data/docwatch data/usage.json data/usage_sweep.json data/due.json\n# raw page text stays out of the public site; the dated page pictures (data/snapshots/<doc>/<date>.jpg) are served\nfind data/snapshots -type f ! -name '*.jpg' -delete 2>/dev/null || true\n"
    },
    {
     "uses": "actions/configure-pages@v5"
    },
    {
     "uses": "actions/upload-pages-artifact@v3",
     "with": {
      "path": "."
     }
    },
    {
     "id": "deploy",
     "uses": "actions/deploy-pages@v4"
    },
    {
     "name": "Turn the run red if a robot step failed",
     "if": "always()",
     "run": "if [ -n \"$PP_FAILED\" ]; then echo \"::error title=Robot steps failed::$PP_FAILED Data was still saved and the site deployed.\"; exit 1; fi\n"
    }
   ],
   "environment": {
    "name": "github-pages",
    "url": "${{ steps.deploy.outputs.page_url }}"
   }
  }
 },
 "on": {
  "schedule": [
   {
    "cron": "17 10-23/2 * * *"
   },
   {
    "cron": "17 4 * * *"
   }
  ],
  "workflow_dispatch": {},
  "push": {
   "branches": [
    "main"
   ]
  }
 }
}
