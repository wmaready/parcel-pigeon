{
 "name": "Watch carrier pages",
 "on": {
  "schedule": [
   {
    "cron": "5 * * * *"
   },
   {
    "cron": "35 12-23 * * 1-5"
   }
  ],
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write",
  "issues": "write",
  "pages": "write",
  "id-token": "write"
 },
 "concurrency": {
  "group": "parcel-pigeon",
  "cancel-in-progress": false
 },
 "jobs": {
  "watch": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 30,
   "environment": {
    "name": "github-pages",
    "url": "${{ steps.deploy.outputs.page_url }}"
   },
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "name": "Install",
     "id": "pw",
     "run": "pip install -r requirements.txt\necho \"version=$(python -c 'import importlib.metadata as m; print(m.version(\"playwright\"))')\" >> \"$GITHUB_OUTPUT\"\n"
    },
    {
     "name": "Cache the Playwright browser",
     "uses": "actions/cache@v4",
     "with": {
      "path": "~/.cache/ms-playwright",
      "key": "playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}"
     }
    },
    {
     "name": "Install the Playwright browser (Doc watch page pictures)",
     "run": "python -m playwright install --with-deps chromium\n"
    },
    {
     "name": "Make sure labels exist",
     "env": {
      "GH_TOKEN": "${{ github.token }}"
     },
     "run": "gh label create draft --color FFD400 --description \"Story drafted by Parcel Pigeon\" --force\ngh label create publish --color 1D7044 --description \"Add this to publish the draft\" --force\ngh label create audit --color 5319E7 --description \"Auditor found something to check\" --force\ngh label create guide-change --color 0E8A16 --description \"Language or trigger change in a carrier guide\" --force\ngh label create first-to-report --color B60205 --description \"Nobody else has reported this yet\" --force\ngh label create alert-review --color D93F0B --description \"Major alert waiting for your OK: reply send or hold\" --force\ngh label create alert-sent --color 0E8A16 --force\ngh label create alert-held --color BFD4F2 --force\n"
    },
    {
     "name": "Publish approved drafts, check carrier pages, send alerts",
     "env": {
      "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
      "PP_MONTHLY_BUDGET": "${{ vars.PP_MONTHLY_BUDGET || '85' }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}",
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "PP_FETCH_PROXY": "${{ secrets.PP_FETCH_PROXY }}",
      "SEC_CONTACT": "${{ secrets.SEC_CONTACT }}"
     },
     "working-directory": "pipeline",
     "run": "# B11: every robot step runs; a failure is recorded as an ::error annotation, the run carries on (data is saved and the\n# site deployed), and the last step of the job turns the run red. Nothing is hidden behind '|| true' any more.\nset +e\nFAILED=\"\"\nstep() { name=\"$1\"; shift; \"$@\" && return 0; echo \"::error title=$name failed::$name exited with an error; the run carried on without it\"; FAILED=\"$FAILED $name;\"; return 1; }\nstep publish.py python publish.py\nstep watch.py python watch.py\n# release pages and the day's earnings: the release, call and 10-Q are found and filed in Docs on every watch run, night included\nstep earnings.py python earnings.py\n# UPS and FedEx weekly fuel from the carriers' own pages, including international (UPS's table is filled in by script, so it is read in the browser)\nstep fuelpages.py python fuelpages.py\nstep docwatch.py python docwatch.py --batch 15\n# company and regulator sources (SEC filings, Federal Register, press wires, newsrooms) every hour, to be first\nstep \"news.py --primary\" python news.py --primary\nstep \"seed export\" node export_seed.js ../index.html ../data/seed.json\nstep alerts.py python alerts.py\nstep \"audit.py --offline\" python audit.py --offline\n# the rate clock as a calendar feed (data/rates.ics)\nstep ratecal.py python ratecal.py\necho \"PP_FAILED=$FAILED\" >> \"$GITHUB_ENV\"\n"
    },
    {
     "name": "Save",
     "run": "git config user.name \"parcel-pigeon-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add data\ngit diff --cached --quiet || (git commit -m \"Watch $(date -u +%Y-%m-%dT%H:%MZ)\" && git pull --rebase && git push)\n"
    },
    {
     "name": "Leave raw page copies out of the public site",
     "run": "rm -rf data/docwatch data/usage.json data/usage_sweep.json data/due.json\n# raw page text stays out of the public site; the dated page pictures (data/snapshots/<doc>/<date>.jpg) are served\nfind data/snapshots -type f ! -name '*.jpg' -delete 2>/dev/null || true\n"
    },
    {
     "uses": "actions/configure-pages@v5"
    },
    {
     "uses": "actions/upload-pages-artifact@v3",
     "with": {
      "path": "."
     }
    },
    {
     "id": "deploy",
     "uses": "actions/deploy-pages@v4"
    },
    {
     "name": "Turn the run red if a robot step failed",
     "if": "always()",
     "run": "if [ -n \"$PP_FAILED\" ]; then echo \"::error title=Robot steps failed::$PP_FAILED Data was still saved and the site deployed.\"; exit 1; fi\n"
    }
   ]
  }
 }
}
