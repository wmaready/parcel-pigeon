{
 "name": "Watch carrier pages",
 "on": {
  "schedule": [
   {
    "cron": "5 * * * *"
   }
  ],
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write",
  "issues": "write",
  "pages": "write",
  "id-token": "write"
 },
 "concurrency": {
  "group": "parcel-pigeon",
  "cancel-in-progress": false
 },
 "jobs": {
  "watch": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 30,
   "environment": {
    "name": "github-pages",
    "url": "${{ steps.deploy.outputs.page_url }}"
   },
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium"
    },
    {
     "name": "Make sure labels exist",
     "env": {
      "GH_TOKEN": "${{ github.token }}"
     },
     "run": "gh label create draft --color FFD400 --description \"Story drafted by Parcel Pigeon\" --force\ngh label create publish --color 1D7044 --description \"Add this to publish the draft\" --force\ngh label create audit --color 5319E7 --description \"Auditor found something to check\" --force\ngh label create guide-change --color 0E8A16 --description \"Language or trigger change in a carrier guide\" --force\ngh label create first-to-report --color B60205 --description \"Nobody else has reported this yet\" --force\ngh label create alert-review --color D93F0B --description \"Major alert waiting for your OK: reply send or hold\" --force\ngh label create alert-sent --color 0E8A16 --force\ngh label create alert-held --color BFD4F2 --force\n"
    },
    {
     "name": "Publish approved drafts, check carrier pages, send alerts",
     "env": {
      "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
      "PP_MONTHLY_BUDGET": "${{ vars.PP_MONTHLY_BUDGET || '75' }}",
      "NTFY_TOPIC": "${{ secrets.NTFY_TOPIC }}",
      "GITHUB_TOKEN": "${{ github.token }}",
      "ONESIGNAL_APP_ID": "${{ secrets.ONESIGNAL_APP_ID }}",
      "ONESIGNAL_API_KEY": "${{ secrets.ONESIGNAL_API_KEY }}",
      "PP_ADMIN_IDS": "${{ secrets.PP_ADMIN_IDS }}",
      "PP_FETCH_PROXY": "${{ secrets.PP_FETCH_PROXY }}",
      "SEC_CONTACT": "${{ secrets.SEC_CONTACT }}"
     },
     "working-directory": "pipeline",
     "run": "python publish.py || echo \"::warning::publish.py failed\"\npython watch.py || echo \"::warning::watch.py failed\"\npython docwatch.py --batch 15 || true\n# company and regulator sources (SEC filings, Federal Register, press wires, newsrooms) every hour, to be first\npython news.py --primary || echo \"::warning::primary news sweep failed\"\nnode export_seed.js ../index.html ../data/seed.json || true\npython alerts.py || echo \"::warning::alerts.py failed\"\npython audit.py --offline || true\n# the rate clock as a calendar feed (data/rates.ics)\npython ratecal.py || echo \"::warning::ratecal.py failed\"\n"
    },
    {
     "name": "Save",
     "run": "git config user.name \"parcel-pigeon-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add data\ngit diff --cached --quiet || (git commit -m \"Watch $(date -u +%Y-%m-%dT%H:%MZ)\" && git pull --rebase && git push)\n"
    },
    {
     "name": "Leave raw page copies out of the public site",
     "run": "rm -rf data/snapshots data/docwatch data/usage.json data/usage_sweep.json data/due.json"
    },
    {
     "uses": "actions/configure-pages@v5"
    },
    {
     "uses": "actions/upload-pages-artifact@v3",
     "with": {
      "path": "."
     }
    },
    {
     "id": "deploy",
     "uses": "actions/deploy-pages@v4"
    }
   ]
  }
 }
}
