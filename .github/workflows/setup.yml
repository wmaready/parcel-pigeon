name: One-time setup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack parcel-pigeon.zip into the right folders
        run: |
          set -e
          cp parcel-pigeon.zip /tmp/pp.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/pp.zip -x '.github/*' -d .
          git config user.name "parcel-pigeon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Set up Parcel Pigeon from the zip"
          git push
