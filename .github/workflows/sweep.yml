{
 "name": "Sweep: vetted market-map growth",
 "permissions": {
  "contents": "write"
 },
 "concurrency": {
  "group": "sweep",
  "cancel-in-progress": false
 },
 "on": {
  "schedule": [
   {
    "cron": "41 3,9,15,21 * * *"
   }
  ],
  "workflow_dispatch": {
   "inputs": {
    "calls": {
     "description": "Most Claude calls this run may use (a first test: 10)",
     "default": "10"
    },
    "status": {
     "description": "Rename/sale/shutdown check batches (6 companies each)",
     "default": "1"
    },
    "vet": {
     "description": "Names to research and verify",
     "default": "4"
    },
    "discover": {
     "description": "Market segments to search for missing companies",
     "default": "1"
    }
   }
  }
 },
 "jobs": {
  "sweep": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 40,
   "if": "github.event_name == 'workflow_dispatch' || vars.SWEEP_ON == 'true'",
   "steps": [
    {
     "uses": "actions/checkout@v4",
     "with": {
      "ref": "main"
     }
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt"
    },
    {
     "name": "Run the sweep",
     "working-directory": "pipeline",
     "env": {
      "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
      "PP_MONTHLY_BUDGET": "${{ vars.PP_MONTHLY_BUDGET || '85' }}",
      "PW_SWEEP_CALLS": "${{ inputs.calls || vars.SWEEP_CALLS || '40' }}",
      "PP_FETCH_PROXY": "${{ secrets.PP_FETCH_PROXY }}",
      "PP_LEDGER": "usage_sweep.json"
     },
     "run": "python sweep.py --status ${{ inputs.status || 1 }} --vet ${{ inputs.vet || 4 }} --discover ${{ inputs.discover || 1 }}"
    },
    {
     "name": "Save",
     "run": "git config user.name \"parcel-pigeon-bot\"\ngit config user.email \"bot@users.noreply.github.com\"\ngit add data\ngit diff --cached --quiet && exit 0\ngit commit -m \"Sweep $(date -u +%Y-%m-%dT%H:%MZ)\"\nfor i in 1 2 3; do\n  if git pull --rebase -q; then git push -q && exit 0; fi\n  for f in $(git diff --name-only --diff-filter=U); do\n    git show :2:$f > /tmp/up.json; git show :3:$f > /tmp/mine.json\n    python pipeline/mergejson.py /tmp/up.json /tmp/mine.json $f && git add $f || { git rebase --abort; exit 1; }\n  done\n  GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }\n  git push -q && exit 0\ndone\nexit 1\n"
    }
   ]
  }
 }
}
